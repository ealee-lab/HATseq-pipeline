$schema: "https://json-schema.org/draft/2020-12/schema"
description: entries for the sample sheet
properties:
  donor:
    type: string
    description: donor name/identifier
  tissue:
    type: string
    description: tissue name
  cell:
    type: string
    description: cell identifier (for single-cell)
  rep:
    type: string
    description: name of replicate
  raw_fastq1:
    type: string
    description: path to read 1
  raw_fastq2:
    type: string
    description: path to read 2
  index_seq:
    type: string
    description: 4 bp in-line index used during library prep 

additionalProperties: false

required:
  - donor
  - raw_fastq1
  - raw_fastq2
  - index_seq